<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0b0a"><title>TONGA SAMPLER</title><link rel="stylesheet" href="style.css">
</head>
<body><main class="app">
<header class="topbar"><div><div class="brand">TONGA <span>SAMPLER</span></div><div id="status" class="status">LISTO · activá el micrófono para grabar</div></div><button id="deleteMode" class="danger">BORRAR</button></header>
<section class="pads">
<button class="pad" data-pad="0"><b>01</b><span class="pad-label">EMPTY</span><canvas class="mini-wave" width="500" height="100"></canvas><small>REC / PLAY</small></button>
<button class="pad" data-pad="1"><b>02</b><span class="pad-label">EMPTY</span><canvas class="mini-wave" width="500" height="100"></canvas><small>REC / PLAY</small></button>
<button class="pad" data-pad="2"><b>03</b><span class="pad-label">EMPTY</span><canvas class="mini-wave" width="500" height="100"></canvas><small>REC / PLAY</small></button>
<button class="pad" data-pad="3"><b>04</b><span class="pad-label">EMPTY</span><canvas class="mini-wave" width="500" height="100"></canvas><small>REC / PLAY</small></button>
</section>
<section class="editor"><div class="editor-head"><div><strong id="selectedName">PAD 01 · SIN AUDIO</strong><span id="readout">PITCH +0 · SPEED 1.00× · POS 0%</span></div><button id="resetEdit" class="small-button">RESET PITCH</button></div>
<div id="waveTouch" class="wave-wrap"><canvas id="mainWave" width="1200" height="300"></canvas><div id="playhead" class="playhead"></div><div class="center-line"></div><div class="gesture-hint">↑↓ PITCH · ←→ SCRATCH · 30 px DE MARGEN</div></div></section>
<section class="controls"><button id="micButton" class="mic">● ACTIVAR MICRÓFONO</button><div class="help"><span>PAD VACÍO: mantener = grabar</span><span>PAD: ↑↓ pitch · ←→ velocidad</span><span>SOLTAR = fade 0,5 s</span><span>EDITOR: ↑↓ pitch permanente</span><span>←→ scratch adelante / reversa</span></div></section>
</main><script src="app.js"></script></body></html>
